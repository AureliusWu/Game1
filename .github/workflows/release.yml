name: Publish verified release
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: canonical-web
          path: artifacts/web
      - uses: actions/download-artifact@v4
        with:
          name: Android-package
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: Windows-package
          path: artifacts/windows
      - name: Require identical assets and source across all platforms
        run: python3 scripts/assemble_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-Courier-release
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable web, APK and EXE assets
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_VERSION: ${{ inputs.version }}
        run: |
          tag="v$GAME_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create "$tag" artifacts/release/* --target "$GITHUB_SHA" --title "余烬信使 $tag · 网页 / Android / Windows" --notes-file "docs/releases/$tag.md"
