name: Android build and device QA
on:
  workflow_call:
    inputs:
      sign_release:
        type: boolean
        default: false
    secrets:
      EMBER_ANDROID_SIGNING_JSON:
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: canonical-web
          path: artifacts/web
      - name: Compile app, instrumented tests and native lint once
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Cache Android 35 system image
        uses: actions/cache@v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: android-system-image-35-google-apis-x86_64-v1
      - name: Boot hardware-accelerated Android emulator
        timeout-minutes: 8
        run: bash scripts/start-android-emulator.sh
      - name: Test offline boot, both landscape directions, input and real save/resume
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest
      - name: Preserve actual landscape draft and skill-tree screenshots
        run: |
          mkdir -p artifacts/android-qa
          for panel in draft star; do
            for orientation in landscape landscape-reverse; do
              adb pull "/sdcard/Download/ember-$panel-$orientation.png" "artifacts/android-qa/$panel-$orientation.png"
            done
          done
          python3 scripts/check_draft_screenshots.py artifacts/android-qa
      - name: Build signed production APK
        if: inputs.sign_release
        working-directory: android
        env:
          EMBER_ANDROID_SIGNING_JSON: ${{ secrets.EMBER_ANDROID_SIGNING_JSON }}
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease
      - name: Verify upgrade certificate and identical web/APK assets
        if: inputs.sign_release
        run: python3 scripts/package_release.py android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.sign_release
        with:
          name: Android-package
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !inputs.sign_release }}
        with:
          name: Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Preserve device evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Android-device-QA
          path: |
            artifacts/android-qa/
            android/app/build/reports/androidTests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/outputs/androidTest-results/
            /tmp/ember-emulator.log
          retention-days: 14
