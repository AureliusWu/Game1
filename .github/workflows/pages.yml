name: GitHub Pages
on:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: canonical-web
          path: artifacts/web
      - name: Extract the already validated web archive
        run: python3 -c "import glob,zipfile; zipfile.ZipFile(glob.glob('artifacts/web/*.zip')[0]).extractall('pages')"
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Check live HTTPS, module MIME and every runtime hash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify-pages.py "$PAGE_URL"
      - uses: actions/upload-artifact@v7.0.2
        with:
          overwrite: true
          name: Pages-live-verification
          path: artifacts/pages/
          if-no-files-found: error
